; patchmaker.ini — esempio configurazione PatchMaker
; Il file reale viene creato nella stessa cartella dell'eseguibile (PatchMaker\bin\Release\)
; e NON deve essere committato (contiene credenziali SSH e chiavi AES).

SshHost=10.10.5.91
SshUser=administrator
; Lasciare vuoto SshPassword per usare autenticazione a chiave privata (consigliato)
SshPassword=
; Percorsi SFTP sul server (usare slash, non backslash)
SshPatchesPath=/C:/xampp/htdocs/Updater/Patches
SshHtdocsPath=/C:/xampp/htdocs/Updater
; Cartella di lavoro locale per i file da includere nella patch
WorkspacePath=.\workspace
; Chiave AES-256 (64 hex) per cifrare data.sah live — da GMSecurity.ini [SahKeyHex]
SahKeyHex=
; Chiave AES-256 (64 hex) per cifrare update.sah nelle patch — da GMSecurity.ini [PatchKeyHex]
; Ruotata automaticamente dal server ogni notte alle 04:00
PatchKeyHex=
; Attiva cifratura data.sah (AES-256-GCM). Default: True
EncryptSah=True
; Attiva cifratura update.sah nelle patch. Default: True
EncryptPatch=True
Language=It
