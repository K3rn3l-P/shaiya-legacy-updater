; GMSecurity.ini — esempio configurazione
; Posizione reale sul server: C:\ShaiyaServer\PSM_Client\Bin\Data\GMSecurity.ini
;
; Genera chiavi (PowerShell):
;   [BitConverter]::ToString([Security.Cryptography.RandomNumberGenerator]::GetBytes(32)).Replace('-','').ToLower()
;
; SahKeyHex:   chiave AES-256 per data.sah live — rotazione MANUALE (rara, major update)
; PatchKeyHex: chiave AES-256 per update.sah nelle patch — rotazione AUTOMATICA alle 04:00

[SETTINGS]
Enabled=1
TokenSecret=<64-hex-chars — genera con script sopra>
ClientSecret=<64-hex-chars — genera con script sopra>
SahKeyHex=<64-hex-chars — genera con script sopra>
PatchKeyHex=<64-hex-chars — genera con script sopra>

[IP_WHITELIST]
admin1=127.0.0.1
