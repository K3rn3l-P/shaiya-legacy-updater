; Public sample launcher configuration.
; Copy to launcher.ini on your deployment server and edit values.
; Keep production keys out of source control.

[Server]
BaseUrl=https://your-domain.example/Updater/
ManifestFile=manifest.json
WebsiteUrl=https://your-domain.example/
RegisterUrl=https://your-domain.example/register
DiscordUrl=
NewsUrl=

[Game]
Executable=game.exe
Arguments=start game
RequireOriginalClientFiles=false
BlockPatchWhenGameRunning=true
; The game ALWAYS goes through server selection now (SKIPSERVERSELECTION is no longer honored).

AutoSelectServer=true
; Initial wait before scanning for the CSelectServer object. The login gate already confirms the
; server list is populated before this point, and AutoSelectFirstServer retries the scan
; (AutoSelectServerRetries x AutoSelectServerRetryDelayMs), so a short delay is safe and saves ~2s.
AutoSelectServerDelayMs=800
AutoSelectServerIndex=0
AutoSelectServerRetries=30
AutoSelectServerRetryDelayMs=500
AutoSelectRetryDelayMs=1200

; Authoritative login gate: wait until the login server populates the server list (proof the
; credentials were accepted) before advancing to server selection. Re-injects between attempts.
; Worst-case wait ~ LoginVerifyTimeoutMs + LoginMaxRetries * LoginVerifyRetryTimeoutMs.
LoginVerifyTimeoutMs=3000
LoginVerifyRetryTimeoutMs=3000
LoginMaxRetries=8

; TCP transition watcher (login -> character selection)
LoginTcpPort=30800
GameTcpPort=30810
TcpPortTransitionDelayMs=2000
TcpPortTransitionTimeoutMs=30000

HideLoginScreens=true
LoginOverlayText=Connecting to the server...
LoginOverlaySubText=Preparing character selection. Please wait.
LoginOverlayRevealDelayMs=6000
LoginOverlayFallbackRevealDelayMs=1000
LoginFlowPatchRestoreDelayMs=2000

HideGameWindowUntilReady=true
GameWindowHideMode=Offscreen
GameWindowHideWaitMs=8000
GameWindowOffscreenX=-32000
GameWindowOffscreenY=-32000

[Launcher]
MinLauncherVersion=1
ForceUpdate=false
RepairEnabled=true
SelfUpdateEnabled=true
MaintenanceMessage=Server is under maintenance.

[Update]
DownloadRetryCount=3
DownloadTimeoutSeconds=30
KeepSuccessfulBackups=false

[SahCrypt]
Enabled=true
UnlockPatchSah=true
ProtectDataSahAfterPatch=true
; Use one key format only:
; KeyHex=64 hex chars (32 bytes)
; KeyText=exactly 32 UTF-8 bytes
; KeyBase64=base64 for 32 raw bytes
; Key=legacy alias (hex if 64 hex chars, otherwise treated as text)
KeyHex=
KeyText=
KeyBase64=
Key=
