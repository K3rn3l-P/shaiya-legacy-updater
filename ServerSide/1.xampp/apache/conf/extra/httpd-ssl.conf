#
# This is the Apache server configuration file providing SSL support.
# It contains the configuration directives to instruct the server how to
# serve pages over an https connection. For detailed information about these 
# directives see <URL:http://httpd.apache.org/docs/2.4/mod/mod_ssl.html>
#

# Listen on port 443 for HTTPS
Listen 443

##
##  SSL Global Context
##
##  All SSL configuration in this context applies both to
##  the main server and all SSL-enabled virtual hosts.
##

# SSL Cipher Suite
# Configure the ciphers that are permitted for negotiation
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

# Order of ciphers
SSLHonorCipherOrder on

# TLS 1.2 + 1.3 only (1.0 e 1.1 deprecati IETF RFC 8996)
SSLProtocol TLSv1.2 TLSv1.3

# Pass Phrase Dialog
SSLPassPhraseDialog  builtin

# SSL Session Cache
SSLSessionCache "shmcb:C:/xampp/apache/logs/ssl_scache(512000)"
SSLSessionCacheTimeout  300

# OCSP Stapling
# Enable stapling for better performance
SSLUseStapling Off
SSLStaplingCache "shmcb:C:/xampp/apache/logs/ssl_stapling(32768)"

##
## SSL Virtual Host Context
##

<VirtualHost _default_:443>
  TraceEnable off

    # General setup for the virtual host
    DocumentRoot "C:/xampp/htdocs/"
    ServerName duff.pinto-lime.ts.net
    ServerAdmin admin@example.com
    ErrorLog "C:/xampp/apache/logs/error.log"
    CustomLog "C:/xampp/apache/logs/ssl_request.log" \
              "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"

    # Enable SSL
    SSLEngine on

    # Server Certificate
    SSLCertificateFile "conf/ssl.crt/server.crt"
    SSLCertificateKeyFile "conf/ssl.key/server.key"
    # Uncomment if you have a certificate chain file
    # SSLCertificateChainFile "conf/ssl.crt/ca-bundle.crt"

    # Access Control
    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>
    <Directory "C:/xampp/apache/cgi-bin">
        SSLOptions +StdEnvVars
    </Directory>

    # SSL Protocol Adjustments
    BrowserMatch "MSIE [2-5]" \
             nokeepalive ssl-unclean-shutdown \
             downgrade-1.0 force-response-1.0

</VirtualHost>


