; sahcrypt.ini — esempio configurazione SahCryptTool
; Il file reale si trova in bin\Win32\Release\ e NON deve essere committato.
; Contiene credenziali SSH e chiave AES — trattare come segreto.

; === Connessione SSH al server (facoltativo — solo per fetch chiave remota) ===
SshHost=10.10.5.91
SshUser=administrator
; Lasciare vuoto SshPassword e usare SshKeyPath per autenticazione a chiave (consigliato)
SshPassword=
SshKeyPath=C:\Users\<utente>\.ssh\id_ed25519

; Path del GMSecurity.ini sul server (usato per fetch chiave)
SshRemotePath=C:\ShaiyaServer\PSM_Client\Bin\Data\GMSecurity.ini

; === Chiave AES-256 — scritta automaticamente dopo SSH fetch ===
; Lasciare vuoto; verrà popolato dallo strumento dopo il fetch dal server.
SahKeyHex=
